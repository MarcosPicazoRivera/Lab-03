name: Lab 3 - Matrix Build Enterprise

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Parte 4: Concurrency
# Si se hace un nuevo push a la misma rama, se cancela la ejecución anterior que esté en progreso para evitar ejecuciones redundantes[cite: 97, 98, 99].
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }} - Node ${{ matrix.node }} (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      [cite_start]fail-fast: true
      matrix:
        [cite_start]os: [ubuntu-latest, windows-latest]
        [cite_start]node: ['18.x', '20.x']
        [cite_start]mode: [debug, release]
        
        # Parte 2: Exclusiones
        # Excluimos una combinación incompatible 
        exclude:
          - os: windows-latest
            node: '18.x'
            mode: debug
            
        # Parte 3: Includes
        # Añadimos variables especiales a una configuración específica que ya existe en la matriz [cite: 93, 94]
        include:
          - os: ubuntu-latest
            node: '20.x'
            mode: release
            [cite_start]environment: production
            [cite_start]extra_var: 'SUPER_SECRET'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Simular validaciones y tests
        shell: bash
        run: |
          echo "Ejecutando en modo ${{ matrix.mode }}..."
          sleep 5 # Simulamos un tiempo de ejecución
          echo "Tests pasados correctamente."

      # Parte 5: Job summary dinámico generado en Markdown [cite: 101, 102, 110]
      - name: Generar Job Summary
        shell: bash 
        run: |
          echo "### 📊 Resumen de Ejecución Enterprise" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuración:** SO \`${{ matrix.os }}\` | Node \`${{ matrix.node }}\` | Modo \`${{ matrix.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Resultado:** Finalizado con éxito ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Tiempo estimado:** ~5 segundos" >> $GITHUB_STEP_SUMMARY
          echo "- **Información de matrix:** Esta es una ejecución generada dinámicamente desde la estrategia matrix." >> $GITHUB_STEP_SUMMARY
          echo "- **Entorno especial:** ${{ matrix.environment || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Variable extra:** ${{ matrix.extra_var || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
